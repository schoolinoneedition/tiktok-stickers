<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok Stickers</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Inter,system-ui;background:#f6f6f8;color:#111}.wrap{max-width:1180px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:24px;font-weight:800}.brand span{color:#777;font-weight:500}.admin{padding:9px 13px;border:1px solid #ddd;border-radius:10px;background:#fff;color:#111;text-decoration:none}.hero{background:#111;color:#fff;border-radius:22px;padding:42px 34px;margin-bottom:28px}.hero h1{font-size:clamp(38px,7vw,70px);line-height:.95;letter-spacing:-3px;margin:0 0 14px}.hero p{color:#ccc;font-size:17px}.tools{display:flex;gap:10px;margin:18px 0}.search,select{padding:13px;border:1px solid #ddd;border-radius:12px;background:#fff;font:inherit}.search{flex:1}.status{color:#777;font-size:14px;margin:10px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.card{background:#fff;border:1px solid #e6e6e8;border-radius:18px;overflow:hidden}.preview{height:210px;background:#eee;display:flex;align-items:center;justify-content:center}.preview img,.preview video{width:100%;height:100%;object-fit:contain}.body{padding:15px}.body h3{margin:0 0 6px}.meta{font-size:12px;color:#888;margin-bottom:12px}.download{display:block;text-align:center;text-decoration:none;color:#fff;background:#111;border-radius:11px;padding:11px;font-weight:700}.empty{text-align:center;color:#777;padding:50px}@media(max-width:650px){.wrap{padding:15px}.hero{padding:30px 22px}.preview{height:180px}}</style></head><body><div class="wrap"><header><div class="brand">TikTok Stickers <span>by XBT</span></div><a class="admin" href="admin.html">Admin</a></header><section class="hero"><h1>Stickers.<br>Download. Done.</h1><p>Browse, preview and download TikTok stickers. No account needed.</p></section><div class="tools"><input id="search" class="search" placeholder="Search stickers..."><select id="category"><option value="">All categories</option></select></div><div id="status" class="status">Loading stickers...</div><main id="grid" class="grid"></main></div><script>const U='https://btnbuchsrfllpzlypjtn.supabase.co',K='sb_publishable_a1gdNTiQdF9587p5K-Sw-Q_nFbvWRmp',S=supabase.createClient(U,K),B='tiktok-stickers';let all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),url=p=>`${U}/storage/v1/object/public/${B}/${p}`;function render(){let q=search.value.toLowerCase(),c=category.value,a=all.filter(x=>(!c||x.category===c)&&(!q||[x.title,x.description,x.category,...(x.tags||[])].join(' ').toLowerCase().includes(q)));status.textContent=`${a.length} sticker${a.length===1?'':'s'}`;grid.innerHTML=a.length?a.map(x=>{let u=url(x.file_path),v=x.mime_type.startsWith('video/');return `<article class="card"><div class="preview">${v?`<video src="${esc(u)}" muted loop autoplay playsinline></video>`:`<img src="${esc(u)}" alt="${esc(x.title)}" loading="lazy">`}</div><div class="body"><h3>${esc(x.title)}</h3><div class="meta">${esc(x.category)} · ${x.downloads||0} downloads</div><a class="download" href="${esc(u)}" download="${esc(x.file_name)}" data-id="${x.id}">Download</a></div></article>`}).join(''):'<div class="empty">No stickers found.</div>'}async function load(){let {data,error}=await S.from('tiktok_stickers').select('*').order('featured',{ascending:false}).order('created_at',{ascending:false});if(error){status.textContent='Could not load stickers.';return}all=data||[];[...new Set(all.map(x=>x.category).filter(Boolean))].sort().forEach(c=>category.insertAdjacentHTML('beforeend',`<option>${esc(c)}</option>`));render()}search.oninput=render;category.onchange=render;document.addEventListener('click',e=>{let a=e.target.closest('.download');if(a)setTimeout(()=>S.rpc('increment_tiktok_sticker_downloads',{sticker_id:a.dataset.id}),0)});load();</script></body></html>
