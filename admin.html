<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok Stickers Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f6f6f8;color:#111;font-family:Inter,system-ui}.wrap{max-width:760px;margin:auto;padding:25px}.card{background:#fff;border:1px solid #e3e3e6;border-radius:18px;padding:24px;margin-top:18px}input,textarea,button{width:100%;padding:12px;border:1px solid #d8d8dc;border-radius:10px;font:inherit;box-sizing:border-box}label{display:block;font-size:13px;font-weight:700;margin:15px 0 6px}button{background:#111;color:#fff;font-weight:700;margin-top:15px;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#777;font-size:14px}.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.item button{width:auto;margin:0;background:#fff;color:#b00020}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a href="index.html">← Back</a><div class="card" id="login"><h1>Admin access</h1><p class="muted">Use your Supabase staff email.</p><input id="email" type="email" placeholder="you@example.com"><button id="loginBtn">Send magic link</button><p id="msg"></p></div><div id="app" style="display:none"><div class="card"><h1>Upload sticker</h1><p class="muted">PNG, JPG, WebP, GIF, SVG, MP4 or WebM.</p><label>File</label><input id="file" type="file" accept="image/*,video/mp4,video/webm"><label>Title</label><input id="title" maxlength="120"><div class="row"><div><label>Category</label><input id="cat" value="General"></div><div><label>Tags</label><input id="tags" placeholder="funny,reaction"></div></div><label>Description</label><textarea id="desc"></textarea><button id="upload">Upload sticker</button><p id="uploadMsg"></p></div><div class="card"><h2>Manage stickers</h2><div id="list">Loading...</div></div><button id="logout">Sign out</button></div></div><script>const U='https://btnbuchsrfllpzlypjtn.supabase.co',K='sb_publishable_a1gdNTiQdF9587p5K-Sw-Q_nFbvWRmp',S=supabase.createClient(U,K),B='tiktok-stickers',$=id=>document.getElementById(id),slug=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').slice(0,120);async function staff(){let {data:{user}}=await S.auth.getUser();if(!user)return false;let {data}=await S.from('staff_roles').select('role').eq('user_id',user.id).in('role',['staff','admin']).maybeSingle();return !!data}async function refresh(){let ok=await staff();$('login').style.display=ok?'none':'block';$('app').style.display=ok?'block':'none';if(ok)load()}async function load(){let {data}=await S.from('tiktok_stickers').select('id,title,category,downloads,file_path').order('created_at',{ascending:false});$('list').innerHTML=(data||[]).map(x=>`<div class="item"><span><b>${x.title}</b><br><small>${x.category} · ${x.downloads} downloads</small></span><button data-id="${x.id}" data-path="${encodeURIComponent(x.file_path)}">Delete</button></div>`).join('')||'<p class="muted">No stickers yet.</p>'}$('loginBtn').onclick=async()=>{let {error}=await S.auth.signInWithOtp({email:$('email').value.trim(),options:{emailRedirectTo:location.href}});$('msg').textContent=error?error.message:'Check your email.'};$('upload').onclick=async()=>{let f=$('file').files[0],title=$('title').value.trim();if(!f||!title)return $('uploadMsg').textContent='Choose a file and title.';let ext=(f.name.split('.').pop()||'bin').toLowerCase(),path=`${Date.now()}-${crypto.randomUUID()}.${ext}`;$('upload').disabled=true;$('uploadMsg').textContent='Uploading...';try{let r=await S.storage.from(B).upload(path,f,{contentType:f.type});if(r.error)throw r.error;r=await S.from('tiktok_stickers').insert({title,slug:slug(title)+'-'+Date.now(),description:$('desc').value.trim(),category:$('cat').value.trim()||'General',tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean),file_path:path,file_name:f.name,mime_type:f.type,file_size:f.size});if(r.error){await S.storage.from(B).remove([path]);throw r.error}$('uploadMsg').textContent='Uploaded.';load()}catch(e){$('uploadMsg').textContent=e.message}finally{$('upload').disabled=false}};$('list').onclick=async e=>{let b=e.target.closest('[data-id]');if(!b||!confirm('Delete this sticker?'))return;await S.from('tiktok_stickers').delete().eq('id',b.dataset.id);await S.storage.from(B).remove([decodeURIComponent(b.dataset.path)]);load()};$('logout').onclick=async()=>{await S.auth.signOut();refresh()};S.auth.onAuthStateChange(()=>refresh());refresh();</script></body></html>
